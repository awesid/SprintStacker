name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test engine and build debug APK
        run: ./gradlew :core:test :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: sprint-stacker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
