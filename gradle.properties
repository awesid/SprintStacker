org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Release builds read real AdMob IDs and the privacy policy URL from these
# properties (set them in ~/.gradle/gradle.properties or with -P, never commit
# real IDs). Debug builds always use Google's test ad units.
# ADMOB_APP_ID=
# ADMOB_INTERSTITIAL_ID=
# ADMOB_REWARDED_ID=
# PRIVACY_POLICY_URL=
